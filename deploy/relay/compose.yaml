name: code3d-relay

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    restart: unless-stopped
    command:
      - tunnel
      - --metrics
      - 127.0.0.1:2000
      - run
      - --token-file
      - /run/secrets/tunnel_token
    secrets:
      - tunnel_token
    networks:
      - edge
      - backend
    depends_on:
      relay:
        condition: service_healthy
    # Compose copies environment-backed secrets into the container at creation;
    # read_only would prevent that. The official image runs as UID 65532.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 128
    healthcheck:
      test: [CMD, cloudflared, tunnel, --metrics, '127.0.0.1:2000', ready]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

  relay:
    build:
      context: ../..
      dockerfile: packages/relay/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      RELAY_TRUST_CLOUDFLARED: 'true'
      RELAY_LIMITS_FILE: /etc/code3d/limits.json
    volumes:
      - ./limits.json:/etc/code3d/limits.json:ro
    networks:
      - backend
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

networks:
  edge:
  backend:
    internal: true

secrets:
  tunnel_token:
    environment: TUNNEL_TOKEN
