name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CODE3D_SITE_URL: https://www.code3d.org/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run lint-prettier

      - name: Test worktree coordination
        run: python3 -B -m unittest discover -s .agents/skills/worktree-development/tests

      - name: Build packages
        run: npm run build:packages

      - name: Check test types and run workspace tests
        run: npm test

      - name: Build app and render-only entry
        run: npm run build --workspace @code3d/app

      - name: Install render browser
        run: npx playwright-core install --with-deps chromium

      - name: Generate website model images
        run: npm run render:web-images

      - name: Build website
        run: npm run build --workspace @code3d/web

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: code3d-www
          path: packages/web/dist/www
          if-no-files-found: error

  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://www.code3d.org/

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download verified website artifact
        uses: actions/download-artifact@v4
        with:
          name: code3d-www
          path: packages/web/dist/www

      - name: Deploy website and App
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
