name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run lint-prettier

      - name: Test worktree coordination
        run: python3 -B -m unittest discover -s .agents/skills/worktree-development/tests

      - name: Build packages
        run: npm run build:packages

      - name: Build app and render-only entry
        run: npm run build --workspace @code3d/app

      - name: Install render browser
        run: npx playwright-core install --with-deps chromium

      - name: Generate website model images
        run: npm run render:web-images

      - name: Build website
        run: npm run build --workspace @code3d/web

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: code3d-www
          path: packages/web/dist/www
          if-no-files-found: error
