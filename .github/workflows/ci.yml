name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      example_pattern:
        description: 'Example path regular expression; empty runs the complete CI'
        type: string
        default: ''

permissions:
  contents: read

env:
  CODE3D_SITE_URL: https://www.code3d.org/

jobs:
  build:
    if: ${{ !inputs.example_pattern }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run lint-prettier

      - name: Test worktree coordination
        run: python3 -B -m unittest discover -s .agents/skills/worktree-development/tests

      - name: Check test types and run workspace tests
        run: npm test

      - name: Pack current npm artifacts
        run: npm run pack:packages

      - name: Verify installed npm tarballs
        run: npm run test:packages

      - name: Verify examples in clean npm projects
        run: npm run test:examples:packages --workspace @code3d/app

      - name: Build app and render-only entry
        run: npm run build --workspace @code3d/app

      - name: Install render browser
        run: npx playwright-core install --with-deps chromium

      - name: Generate website model images
        run: npm run render:web-images

      - name: Build website
        run: npm run build --workspace @code3d/web

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: code3d-www
          path: packages/web/dist/www
          if-no-files-found: error

  # Software-rendered runners need minutes per example, so the App examples run
  # as independent shards instead of one serial step.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and pack current packages
        run: |
          npm run build:packages
          npm run pack:packages

      - name: Install render browser
        run: npx playwright-core install --with-deps chromium

      - name: Exercise the App example shard
        run: npm run test:examples:browser --workspace @code3d/app
        env:
          CODE3D_EXAMPLE_SHARD: ${{ matrix.shard }}/4
          CODE3D_EXAMPLE_PATTERN: ${{ inputs.example_pattern }}
