name: Publish packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      CODE3D_RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Require a release tag ref
        if: github.ref_type != 'tag'
        run: |
          echo 'Run this workflow on an existing version tag, for example: gh workflow run publish.yml --ref v0.0.1-alpha.2'
          exit 1

      - name: Check out the release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.1

      - name: Validate the tag and select package versions
        run: node scripts/publish-packages.mjs --plan

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and test packages
        run: |
          npm run lint-prettier
          npm test
          npm run test:packages

      - name: Verify clean npm examples
        run: npm run test:examples:packages --workspace @code3d/app

      - name: Install example test browser
        run: npx playwright-core install --with-deps chromium

      - name: Verify every App example before publication
        run: npm run test:examples:browser --workspace @code3d/app

      - name: Upload verified npm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages-${{ github.ref_name }}
          path: dist/packages
          if-no-files-found: error

      - name: Publish matching package versions on npm
        run: node scripts/publish-packages.mjs --publish
