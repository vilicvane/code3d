<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11110f" />
    <meta name="application-name" content="Code3D" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Code3D — Prototype 01</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      let leaving = false;
      const stop = () => {
        leaving = true;
      };
      window.addEventListener('pagehide', stop, {once: true});
      try {
        await import('/src/main.ts');
      } catch (error) {
        // Stop an abandoned startup without reporting a failure in the next page.
        if (
          !leaving ||
          !(error instanceof DOMException) ||
          error.name !== 'AbortError'
        )
          throw error;
      } finally {
        window.removeEventListener('pagehide', stop);
      }
    </script>
  </body>
</html>
